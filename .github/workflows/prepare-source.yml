name: Prepare source archive (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --prefix=Home-Face-Guard/ --output=Home-Face-Guard-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-source
          path: Home-Face-Guard-source.zip
          retention-days: 7
